name: Final public ref cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite remaining public branches to clean history
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: a96ff15d1e1127c9dc47408e048fc7d5884810e0
        run: |
          set -euo pipefail
          git init cleanup
          cd cleanup
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main "$CLEAN_SHA"
          git ls-remote --heads origin 'refs/heads/*' |
            awk '{sub("refs/heads/", "", $2); print $2}' |
            while IFS= read -r branch; do
              case "$branch" in
                main|feat/calle-india-tamil-support)
                  echo "Preserving $branch"
                  ;;
                *)
                  echo "Resetting $branch to $CLEAN_SHA"
                  git push origin "$CLEAN_SHA:refs/heads/$branch" --force
                  ;;
              esac
            done
